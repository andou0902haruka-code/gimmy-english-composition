<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gimmy英作文</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1c1b19; --sub:#6b6862; --line:#e2ded4;
  --accent:#c2410c; --accent-soft:#fff1e9;
  --ok:#15803d; --warn:#b45309; --ng:#b91c1c;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --r:14px;
  --c-new:#c2410c; --c-seen:#0e7490; --c-rand:#6d28d9; --c-fav:#b45309; --c-rev:#15803d;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16151a; --card:#211f26; --ink:#f0eef2; --sub:#a5a1ad; --line:#332f3a;
    --accent:#fb923c; --accent-soft:#3a2418;
    --ok:#4ade80; --warn:#fbbf24; --ng:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
    --c-new:#fb923c; --c-seen:#22d3ee; --c-rand:#c4b5fd; --c-fav:#fbbf24; --c-rev:#4ade80;
  }
}
:root[data-theme="dark"]{
  --bg:#16151a; --card:#211f26; --ink:#f0eef2; --sub:#a5a1ad; --line:#332f3a;
  --accent:#fb923c; --accent-soft:#3a2418;
  --ok:#4ade80; --warn:#fbbf24; --ng:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --c-new:#fb923c; --c-seen:#22d3ee; --c-rand:#c4b5fd; --c-fav:#fbbf24; --c-rev:#4ade80;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 90px}
header{padding:8px 0 18px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:.01em}
h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--sub);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:11px 16px;transition:.12s}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.row{display:flex;gap:9px;flex-wrap:wrap}
.grid{display:grid;gap:10px}
.corner{grid-template-columns:1fr 1fr}
@media(max-width:520px){.corner{grid-template-columns:1fr}}
.corner button{text-align:left;padding:14px 16px;line-height:1.45;
  border-left:4px solid var(--cc,var(--line))}
.corner b{display:block;font-size:15px;margin-bottom:2px;color:var(--cc,var(--ink))}
.corner span{font-size:12px;color:var(--sub)}
.corner .n{float:right;font-size:12px;color:var(--sub);font-weight:600}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);font-weight:600}
.ja-q{font-size:26px;font-weight:700;line-height:1.5;margin:14px 0 6px}
.en-a{font-size:23px;font-weight:600;color:var(--accent);margin:6px 0;line-height:1.45}
.timer{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width .1s linear}
.timer.over i{background:var(--ng)}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.score button{padding:13px 6px;font-weight:600;font-size:15px}
.score button small{display:block;font-size:10.5px;font-weight:400;color:var(--sub);margin-top:2px}
.meta{font-size:13.5px;color:var(--sub);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.meta b{color:var(--ink)}
.apply{margin-top:8px;font-size:14px;padding-left:0}
.apply li{margin-bottom:9px;list-style:none}
.apply .aj{color:var(--sub);font-size:13px}
.apply .ae{font-weight:500}
.spk{border:none;background:none;padding:2px 5px;font-size:15px;opacity:.55;border-radius:6px}
.spk:hover{opacity:1;background:var(--accent-soft)}
.star{border:none;background:none;font-size:19px;padding:2px 6px;line-height:1;
  color:var(--sub);opacity:.5;border-radius:6px}
.star.on{color:var(--c-fav);opacity:1}
.prog{font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between;
  align-items:center;gap:10px;margin-bottom:10px}
.hidden{display:none!important}
.item{border-bottom:1px solid var(--line);padding:13px 0;display:flex;gap:10px;align-items:flex-start}
.item:last-child{border-bottom:none}
.item .body{flex:1;min-width:0}
.item .ij{font-weight:600;font-size:15px}
.item .ie{color:var(--accent);font-size:14.5px}
.item .ip{font-size:11.5px;color:var(--sub);margin-top:2px}
.item.gone{opacity:.45}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat div b{display:block;font-size:21px;line-height:1.3}
.stat div span{font-size:11px;color:var(--sub)}
.opt{display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--sub);flex-wrap:wrap}
.opt select{font:inherit;font-size:13px;padding:5px 8px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.opt label{display:flex;align-items:center;gap:5px}
.note{font-size:12.5px;color:var(--sub);background:var(--accent-soft);
  padding:10px 12px;border-radius:10px;margin-top:12px}
.badge-seen{font-size:10.5px;color:var(--c-seen);border:1px solid currentColor;
  border-radius:99px;padding:1px 7px;font-weight:600;vertical-align:2px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;
  align-items:flex-end;justify-content:center;z-index:50}
.sheet .inner{background:var(--card);border-radius:18px 18px 0 0;padding:22px 18px 30px;
  width:100%;max-width:680px;box-shadow:var(--shadow)}
@media(min-width:560px){.sheet{align-items:center}.sheet .inner{border-radius:18px;margin:0 16px}}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0 4px}
.counts button{padding:15px 4px;font-weight:600}
.linkbtn{border:none;background:none;color:var(--sub);font-size:12px;
  text-decoration:underline;padding:4px 2px}
/* MOTIV:CSS:BEGIN */
/* ============================================================
   やる気の仕掛け — 見た目（連続日数＋12週カレンダー／レベル＆XP／バッジ12種）
   正本: .claude/skills_assets/motivation/motiv.css
   4つのアプリ（writing-compose / speaking-compose / 表現メモ / 英単語ノート）へ
   inject.py が同じ中身を配る。直すときは必ずこのファイルを直して inject.py を回すこと
   （生成HTMLを直接いじっても build.py / inject.py で消える）。
   ・色はアプリの変数に頼らず、この中で完結させる（4アプリで同じ見た目にするため）。
     アプリ側で色を変えたいときは .mv-wrap の --mv-* を上書きする
   ・クラス名は全て mv- 始まり。4アプリのどれとも衝突していないことを確認済み
   ============================================================ */
.mv-wrap{
  --mv-fire:#e2701a; --mv-fire-soft:#fdf1e4; --mv-fire-line:#f3d6b4;
  --mv-lv:#3552d8;   --mv-lv-soft:#eef1ff;   --mv-lv-line:#ccd6f7;
  --mv-cal0:#eceff5; --mv-cal1:#cfe3d8; --mv-cal2:#8fcbab; --mv-cal3:#4da97c; --mv-cal4:#1c7f52;
  --mv-ink:#181d27; --mv-sub:#5f6879; --mv-mute:#8a93a3; --mv-line:#e4e7ee; --mv-card:#fff;
  font-size:16px; line-height:1.7; color:var(--mv-ink);
}
.mv-wrap *{box-sizing:border-box;}

/* --- 上段: レベル＆XP と 連続日数 --- */
.mv-top{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;}
.mv-box{flex:1 1 240px;border:1px solid var(--mv-line);border-radius:12px;padding:14px 16px;background:var(--mv-card);}
.mv-box.mv-b-lv{border-color:var(--mv-lv-line);background:var(--mv-lv-soft);}
.mv-box.mv-b-fire{border-color:var(--mv-fire-line);background:var(--mv-fire-soft);}
.mv-lv-row{display:flex;align-items:center;gap:13px;}
.mv-chip{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:var(--mv-lv);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
.mv-chip .mv-c-l{font-size:.6rem;letter-spacing:.06em;opacity:.85;}
.mv-chip .mv-c-n{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;}
.mv-lv-main{flex:1 1 auto;min-width:0;}
.mv-title{font-weight:700;font-size:1rem;color:var(--mv-lv);}
.mv-xp{font-size:.78rem;color:var(--mv-sub);}
.mv-bar{height:9px;border-radius:999px;background:#dbe2f6;overflow:hidden;margin:7px 0 4px;}
.mv-bar i{display:block;height:100%;background:var(--mv-lv);border-radius:999px;transition:width .5s ease;}
.mv-next{font-size:.75rem;color:var(--mv-mute);}

.mv-fire-row{display:flex;align-items:center;gap:13px;}
.mv-flame{font-size:2.1rem;line-height:1;filter:grayscale(1);opacity:.4;}
.mv-flame.mv-on{filter:none;opacity:1;}
.mv-days{font-size:1rem;color:var(--mv-fire);font-weight:700;}
.mv-days b{font-size:1.9rem;letter-spacing:-.02em;}
.mv-sub{font-size:.75rem;color:var(--mv-sub);font-weight:400;}

/* --- 12週カレンダー（1マス=1日・12列×7行） --- */
.mv-cal-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;
  margin:18px 0 8px;}
.mv-cal-ttl{font-weight:700;font-size:.92rem;}
.mv-cal-note{font-size:.74rem;color:var(--mv-mute);}
.mv-cal{display:flex;gap:6px;align-items:flex-start;overflow-x:auto;padding-bottom:4px;}
.mv-wd{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;flex:0 0 auto;padding-top:15px;}
.mv-wd span{height:14px;font-size:.6rem;color:var(--mv-mute);line-height:14px;}
.mv-grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;min-width:250px;}
.mv-col{display:grid;grid-template-rows:auto repeat(7,1fr);gap:3px;}
.mv-mon{height:12px;font-size:.58rem;color:var(--mv-mute);text-align:left;white-space:nowrap;}
.mv-d{height:14px;border-radius:3px;background:var(--mv-cal0);}
.mv-d.mv-l1{background:var(--mv-cal1);}
.mv-d.mv-l2{background:var(--mv-cal2);}
.mv-d.mv-l3{background:var(--mv-cal3);}
.mv-d.mv-l4{background:var(--mv-cal4);}
.mv-d.mv-today{box-shadow:0 0 0 2px var(--mv-fire);}
.mv-d.mv-future{background:transparent;border:1px dashed #e8ebf2;}
.mv-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:7px;
  font-size:.68rem;color:var(--mv-mute);}
.mv-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--mv-cal0);}
.mv-legend i.mv-l1{background:var(--mv-cal1);} .mv-legend i.mv-l2{background:var(--mv-cal2);}
.mv-legend i.mv-l3{background:var(--mv-cal3);} .mv-legend i.mv-l4{background:var(--mv-cal4);}

/* --- バッジ12種 --- */
.mv-bd-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;
  margin:20px 0 8px;}
.mv-bd-ttl{font-weight:700;font-size:.92rem;}
.mv-bd-n{font-size:.74rem;color:var(--mv-mute);}
.mv-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;}
.mv-bd{border:1px solid var(--mv-line);border-radius:11px;padding:10px 8px;text-align:center;
  background:#f7f8fb;color:var(--mv-mute);}
.mv-bd .mv-bd-ic{font-size:1.5rem;line-height:1.2;filter:grayscale(1);opacity:.35;}
.mv-bd .mv-bd-nm{font-size:.72rem;font-weight:700;margin-top:3px;line-height:1.4;}
.mv-bd .mv-bd-cd{font-size:.64rem;margin-top:2px;line-height:1.4;}
.mv-bd.mv-got{background:#fff;border-color:var(--mv-fire-line);color:var(--mv-ink);
  box-shadow:0 1px 2px rgba(24,29,39,.05);}
.mv-bd.mv-got .mv-bd-ic{filter:none;opacity:1;}
.mv-bd.mv-got .mv-bd-cd{color:var(--mv-fire);}
/* もう少しで取れるバッジ（進み具合を下に出す） */
.mv-bd .mv-pg{height:4px;border-radius:999px;background:#e4e7ee;overflow:hidden;margin-top:6px;}
.mv-bd .mv-pg i{display:block;height:100%;background:var(--mv-fire);opacity:.6;}

/* --- 出たり消えたりする通知（XP・レベルアップ・バッジ獲得） --- */
.mv-toast-box{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;
  display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;
  width:max-content;max-width:92vw;}
.mv-toast{background:#181d27;color:#fff;border-radius:999px;padding:8px 18px;font-size:.85rem;
  font-weight:700;box-shadow:0 6px 22px rgba(24,29,39,.28);opacity:0;transform:translateY(10px);
  animation:mvPop .35s ease forwards;line-height:1.5;text-align:center;}
.mv-toast.mv-t-lv{background:var(--mv-lv);}
.mv-toast.mv-t-bd{background:var(--mv-fire);}
.mv-toast.mv-out{animation:mvOut .4s ease forwards;}
@keyframes mvPop{to{opacity:1;transform:translateY(0);}}
@keyframes mvOut{to{opacity:0;transform:translateY(-8px);}}
@media (prefers-reduced-motion:reduce){
  .mv-toast{animation:none;opacity:1;transform:none;}
  .mv-bar i{transition:none;}
}
@media (max-width:480px){
  .mv-badges{grid-template-columns:repeat(3,1fr);}
  .mv-chip{width:50px;height:50px;}
  .mv-chip .mv-c-n{font-size:1.3rem;}
}
/* MOTIV:CSS:END */
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Gimmy英作文</h1>
  <div class="sub">日本語を見た瞬間に英語を出す練習 — 素材: <span id="srcmeta"></span></div>
</header>

<!-- ================= HOME ================= -->
<section id="home">
  <div class="card">
    <div class="stat">
      <div><b id="s-total">0</b><span>収録</span></div>
      <div><b id="s-done">0</b><span>学習ずみ</span></div>
      <div><b id="s-fav">0</b><span>お気に入り</span></div>
      <div><b id="s-due">0</b><span>今日の復習</span></div>
    </div>
  </div>

  <div class="card">
    <h2>どこから解く</h2>
    <div class="grid corner">
      <button style="--cc:var(--c-new)"  onclick="pick('new')"><b>未学習 <span class="n" id="n-new">0</span></b><span>まだ一度も答え合わせしていないフレーズ</span></button>
      <button style="--cc:var(--c-seen)" onclick="pick('seen')"><b>学習ずみ <span class="n" id="n-seen">0</span></b><span>一度でも答え合わせしたフレーズ</span></button>
      <button style="--cc:var(--c-rand)" onclick="pick('rand')"><b>完全ランダム <span class="n" id="n-rand">0</span></b><span>学習ずみも未学習も混ぜて出す</span></button>
      <button style="--cc:var(--c-fav)"  onclick="pick('fav')"><b>お気に入り <span class="n" id="n-fav">0</span></b><span>星を付けたフレーズだけ</span></button>
      <button style="--cc:var(--c-rev)"  onclick="pick('review')"><b>今日の復習 <span class="n" id="n-review">0</span></b><span>間隔をあけて出しなおす（6段の箱）</span></button>
    </div>
    <div class="opt" style="margin-top:16px">
      <label>制限時間
        <select id="limit" onchange="saveOpt()">
          <option value="3">3秒</option><option value="5">5秒</option>
          <option value="8">8秒</option><option value="0">なし</option>
        </select>
      </label>
      <label><input type="checkbox" id="o-audio" onchange="saveOpt()">日本語を聞く</label>
      <label><input type="checkbox" id="o-nonstop" onchange="saveOpt()">自動で答えを出す</label>
    </div>
    <div class="note">答え合わせをした瞬間に記録が確定します。途中でやめても、そこまでは学習ずみとして残ります。</div>
  </div>

  <div class="card">
    <div id="motiv-body"></div>
  </div>

  <div class="card">
    <div class="prog"><b style="color:var(--ink);font-size:15px">収録フレーズ</b>
      <span><button class="linkbtn" onclick="toggleDel()" id="delbtn"></button>
      <button class="linkbtn" onclick="toggleList()" id="listbtn">ひらく</button></span></div>
    <div id="list" class="hidden"></div>
  </div>

  <div class="card">
    <h2>端末間の共有</h2>
    <div class="sub" id="syncstat">共有OFF</div>
    <div class="row" style="margin-top:10px">
      <button onclick="changeSyncId()">合言葉を設定する</button>
    </div>
    <div class="note">同じ合言葉を入れた端末どうしで、学習ずみ・復習箱・お気に入り・削除・やる気の記録が共有されます。</div>
  </div>
</section>

<!-- ================= PLAY ================= -->
<section id="play" class="hidden">
  <div class="prog">
    <span id="p-count"></span>
    <span><span id="p-solved" style="margin-right:10px"></span>
    <button class="linkbtn" onclick="quit()">やめる</button></span>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span class="pill" id="p-pattern"></span>
      <span><span id="p-seen"></span><button class="star" id="p-star" onclick="toggleFav(cur.id);renderStar()">☆</button></span>
    </div>
    <div class="ja-q" id="p-ja"></div>
    <div class="timer" id="p-timer"><i></i></div>

    <div id="p-before">
      <div class="row"><button class="primary" style="flex:1" onclick="reveal()">答えを見る</button></div>
    </div>

    <div id="p-after" class="hidden">
      <div class="en-a" id="p-en"></div>
      <div class="row" style="margin-bottom:12px">
        <button class="spk" onclick="playEn()">▶ 音声</button>
        <button class="spk" onclick="playEn(.7)">▶ ゆっくり</button>
      </div>
      <div style="font-size:13px;color:var(--sub);margin-bottom:7px">どれくらい言えた？</div>
      <div class="score">
        <button onclick="grade(100)">100%<small>完全に一致</small></button>
        <button onclick="grade(80)">80%<small>ほぼ同じ</small></button>
        <button onclick="grade(60)">60%<small>意味は通る</small></button>
        <button onclick="grade(40)">40%<small>半分だけ</small></button>
        <button onclick="grade(20)">20%<small>単語だけ</small></button>
        <button onclick="grade(0)">0%<small>出てこない</small></button>
      </div>
      <div class="meta">
        <div><b>型</b> — <span id="p-ptn"></span></div>
        <div style="margin-top:6px" id="p-exp"></div>
        <div style="margin-top:10px"><b>この型で言えること</b></div>
        <ul class="apply" id="p-apply"></ul>
      </div>
    </div>
  </div>
</section>

<!-- ================= RESULT ================= -->
<section id="result" class="hidden">
  <div class="card">
    <h2 id="r-title">おつかれさま</h2>
    <div class="stat" style="grid-template-columns:repeat(3,1fr)">
      <div><b id="r-n">0</b><span>解いた問数</span></div>
      <div><b id="r-avg">0%</b><span>平均</span></div>
      <div><b id="r-weak">0</b><span>要復習</span></div>
    </div>
    <div id="r-list" style="margin-top:16px"></div>
    <div class="row" style="margin-top:16px">
      <button class="primary" style="flex:1" onclick="go('home')">ホームへ</button>
      <button id="r-more" onclick="resume()">残りを続ける</button>
    </div>
  </div>
</section>
</div>

<!-- 問題数を選ぶシート -->
<div id="sheet" class="sheet hidden" onclick="if(event.target===this)closeSheet()">
  <div class="inner">
    <h2 id="sh-title" style="font-size:17px">何問やる？</h2>
    <div class="sub" id="sh-sub"></div>
    <div class="counts" id="sh-counts"></div>
    <button class="linkbtn" style="margin-top:8px" onclick="closeSheet()">やめる</button>
  </div>
</div>

/* ============================================================

   ------------------------------------------------------------

     var MV_ENV = {

       save(st){ 状態を保存する（クラウド同期もここで） },
       seed(){ return { 'YYYY-MM-DD': 件数 } },  // 任意。既存の記録から日ごとの件数を復元
       unit: '問',                                // 任意。件数の単位（既定は '件'）
       mount: 'motiv-body'                        // 描画先の要素id
     }
   呼びかた:
     mvGain(ok)   … 1件ぶん答え合わせが済んだ瞬間に呼ぶ。ok は true / false / 'half'
     mvRender()   … 画面を描き直す
     mvMerge(a,b) … 2台ぶんの状態を合流させる（合言葉同期の取り込み側で使う）

   設計の約束:
   ・記録するのは「答え合わせ・採点が済んだ瞬間」だけ。出題しただけでは増やさない
     （途中でやめてもそこまでは残る、という他コーナーの数え方と揃える）
   ・XP は 1件10点＋正解でさらに5点（半分の出来なら2点）。その日の1件目には
     連続日数ボーナス（連続日数×5点・7日ぶんで頭打ち）が乗る
   ・過去にさかのぼって XP を書き換えない（消えない記録にする）
   ============================================================ */

/* --- XP とレベルの決まり --- */
var MV_XP_BASE = 10, MV_XP_OK = 5, MV_XP_HALF = 2;
var MV_STREAK_XP = 5, MV_STREAK_CAP = 7;
var MV_CAL_WEEKS = 12;                       /* カレンダーの週数（12週＝84日） */
var MV_STEPS = [1, 5, 10, 20];               /* カレンダーの濃さの段（件数） */

function mvNeed(lv) { return 100 + (lv - 1) * 50; }          /* lv → lv+1 に必要なXP */
function mvTitle(lv) {
  if (lv >= 30) return '名人';
  if (lv >= 20) return '師範';
  if (lv >= 15) return '達人';
  if (lv >= 10) return '常連';
  if (lv >= 5) return 'みならい';
  return 'かけだし';
}
function mvLevel(xp) {
  var lv = 1, rest = Math.max(0, xp | 0);
  while (lv < 99 && rest >= mvNeed(lv)) { rest -= mvNeed(lv); lv++; }
  return { lv: lv, cur: rest, need: mvNeed(lv), title: mvTitle(lv) };
}

/* --- 日付（端末のローカル日付。UTCずれで日をまたがせない） --- */
function mvYmd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function mvToday() { return mvYmd(new Date()); }
function mvShift(ymd, n) {
  var p = String(ymd).split('-');
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  d.setDate(d.getDate() + n);
  return mvYmd(d);
}

/* --- 状態 --- */
function mvBlank() { return { v: 1, days: {}, xp: 0, badges: {}, seeded: 0 }; }
var MV_ST = null;
function mvEnv() { return (typeof MV_ENV !== 'undefined' && MV_ENV) ? MV_ENV : {}; }
function mvUnit() { return mvEnv().unit || '件'; }
function mvState() {
  if (MV_ST) return MV_ST;
  var raw = null;
  try { raw = mvEnv().load ? mvEnv().load() : null; } catch (e) { raw = null; }
  MV_ST = Object.assign(mvBlank(), (raw && typeof raw === 'object') ? raw : {});
  if (!MV_ST.days || typeof MV_ST.days !== 'object') MV_ST.days = {};
  if (!MV_ST.badges || typeof MV_ST.badges !== 'object') MV_ST.badges = {};
  MV_ST.xp = MV_ST.xp | 0;
  /* 過去の記録から日ごとの件数を1回だけ復元する（このアプリを使ってきた分をゼロに戻さないため） */
  if (!MV_ST.seeded && mvEnv().seed) {
    var s = null;
    try { s = mvEnv().seed(); } catch (e) { s = null; }
    if (s && typeof s === 'object') {
      Object.keys(s).forEach(function (d) {
        var n = s[d] | 0;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || n <= 0) return;
        var cur = MV_ST.days[d] || { n: 0, xp: 0 };
        if (n > cur.n) { cur.n = n; cur.xp = n * MV_XP_BASE; MV_ST.days[d] = cur; }
      });
      MV_ST.xp = mvSumXp(MV_ST);

    MV_ST.seeded = 1;
    mvCheckBadges(MV_ST);

  }
  return MV_ST;
}
function mvSave() {

}
function mvSumXp(st) {
  var t = 0;
  Object.keys(st.days).forEach(function (d) { t += (st.days[d].xp | 0); });
  return t;
}
function mvTotalItems(st) {
  var t = 0;
  Object.keys(st.days).forEach(function (d) { t += (st.days[d].n | 0); });

}
function mvActiveDays(st) {
  return Object.keys(st.days).filter(function (d) { return (st.days[d].n | 0) > 0; }).length;
}
function mvMaxDay(st) {
  var m = 0;
  Object.keys(st.days).forEach(function (d) { m = Math.max(m, st.days[d].n | 0); });

}

/* --- 連続日数 ---

   最長は全期間から計算し直す（ずれても自動で直る） */
function mvStreak(st) {
  st = st || mvState();
  var today = mvToday();
  var has = function (d) { return (st.days[d] && (st.days[d].n | 0) > 0); };
  var cur = 0, at = has(today) ? today : (has(mvShift(today, -1)) ? mvShift(today, -1) : null);
  while (at && has(at)) { cur++; at = mvShift(at, -1); }
  var ds = Object.keys(st.days).filter(function (d) { return has(d); }).sort();
  var best = 0, run = 0, prev = null;
  ds.forEach(function (d) {
    run = (prev && mvShift(prev, 1) === d) ? run + 1 : 1;
    prev = d;
    if (run > best) best = run;
  });
  return { cur: cur, best: Math.max(best, cur), today: has(today) ? (st.days[today].n | 0) : 0 };
}

/* --- バッジ12種 ---
   条件は「いま何件／目標何件」の形で持つ。取れていないバッジにも進み具合を出す */
var MV_BADGES = [
  { k: 'first', ic: '🌱', nm: 'はじめの一歩', cd: '1件やってみる', goal: 1, now: function (st) { return mvTotalItems(st); } },

/* 条件を満たしたバッジに取得日を付ける。新しく取れたものの一覧を返す */
function mvCheckBadges(st) {
  st = st || mvState();
  var got = [], today = mvToday();
  MV_BADGES.forEach(function (b) {
    if (st.badges[b.k]) return;
    if (b.now(st) >= b.goal) { st.badges[b.k] = today; got.push(b); }
  });
  return got;
}

/* --- 1件ぶん記録する（答え合わせが済んだ瞬間に呼ぶ） --- */
function mvGain(ok, n) {
  var st = mvState();
  n = Math.max(1, n || 1);
  var d = mvToday(), h = new Date().getHours();
  var rec = st.days[d] || (st.days[d] = { n: 0, xp: 0 });
  var first = (rec.n | 0) === 0;
  var beforeLv = mvLevel(st.xp).lv;
  var xp = (MV_XP_BASE + (ok === true ? MV_XP_OK : (ok === 'half' ? MV_XP_HALF : 0))) * n;
  rec.n = (rec.n | 0) + n;
  if (h >= 5 && h < 9) rec.am = 1;
  if (h >= 22 || h < 4) rec.pm = 1;
  if (first) xp += Math.min(mvStreak(st).cur, MV_STREAK_CAP) * MV_STREAK_XP;
  rec.xp = (rec.xp | 0) + xp;
  st.xp = (st.xp | 0) + xp;
  var newBadges = mvCheckBadges(st);
  var afterLv = mvLevel(st.xp).lv;
  mvSave();
  mvToast('＋' + xp + ' XP');
  if (first && mvStreak(st).cur > 1) mvToast('🔥 ' + mvStreak(st).cur + '日連続', 'fire');
  if (afterLv > beforeLv) mvToast('レベル' + afterLv + '（' + mvTitle(afterLv) + '）になりました', 'lv');
  newBadges.forEach(function (b) { mvToast('バッジ獲得 ' + b.ic + ' ' + b.nm, 'bd'); });
  mvRender();
  return { xp: xp, level: afterLv, levelUp: afterLv > beforeLv, badges: newBadges };
}

/* --- 2台ぶんの記録を合流させる（合言葉同期の取り込み側で使う） ---
   片方が遅れていても、多い方の件数・XP を残す＝どちらの端末の学習も消えない */
function mvMerge(local, remote) {
  var a = Object.assign(mvBlank(), (local && typeof local === 'object') ? local : {});
  var b = (remote && typeof remote === 'object') ? remote : {};
  /* 渡された側を書き換えないよう、日ごとの記録とバッジは1段深くまで写しておく */
  var ld = (a.days && typeof a.days === 'object') ? a.days : {};
  a.days = {};
  Object.keys(ld).forEach(function (d) { if (ld[d] && typeof ld[d] === 'object') a.days[d] = Object.assign({}, ld[d]); });
  a.badges = Object.assign({}, (a.badges && typeof a.badges === 'object') ? a.badges : {});
  var bd = (b.days && typeof b.days === 'object') ? b.days : {};
  Object.keys(bd).forEach(function (d) {
    var r = bd[d] || {}, l = a.days[d];
    if (!l || (r.n | 0) > (l.n | 0)) {
      a.days[d] = { n: r.n | 0, xp: Math.max(r.xp | 0, l ? (l.xp | 0) : 0), am: (r.am || (l && l.am)) ? 1 : undefined, pm: (r.pm || (l && l.pm)) ? 1 : undefined };
    } else {
      l.xp = Math.max(l.xp | 0, r.xp | 0);
      if (r.am) l.am = 1;
      if (r.pm) l.pm = 1;
    }
    if (a.days[d].am === undefined) delete a.days[d].am;
    if (a.days[d].pm === undefined) delete a.days[d].pm;
  });
  var rb = (b.badges && typeof b.badges === 'object') ? b.badges : {};
  Object.keys(rb).forEach(function (k) {
    if (!a.badges[k] || rb[k] < a.badges[k]) a.badges[k] = rb[k];   /* 先に取った日を残す */
  });
  a.xp = Math.max(mvSumXp(a), a.xp | 0, b.xp | 0);
  a.seeded = (a.seeded || b.seeded) ? 1 : 0;
  return a;
}

/* --- 通知（画面下に出て消える） --- */
var MV_TOASTS = null;
function mvToast(msg, kind) {
  if (typeof document === 'undefined' || !document.body) return;
  if (!MV_TOASTS || !MV_TOASTS.isConnected) {
    MV_TOASTS = document.createElement('div');
    MV_TOASTS.className = 'mv-toast-box';
    document.body.appendChild(MV_TOASTS);
  }
  var el = document.createElement('div');
  el.className = 'mv-toast' + (kind ? ' mv-t-' + kind : '');
  el.textContent = msg;
  MV_TOASTS.appendChild(el);
  setTimeout(function () {
    el.classList.add('mv-out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 420);
  }, kind ? 3200 : 2000);
}

/* --- 12週カレンダー ---
   今週の月曜から11週さかのぼった月曜が左端。1列＝1週・上から月〜日 */
function mvCalHtml(st) {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var back = (today.getDay() + 6) % 7;                    /* 月曜=0 になるようにずらす */
  var start = new Date(today); start.setDate(start.getDate() - back - (MV_CAL_WEEKS - 1) * 7);
  var tKey = mvToday(), cols = [], prevMon = -1;
  for (var w = 0; w < MV_CAL_WEEKS; w++) {
    var cells = [], monLab = '';
    for (var i = 0; i < 7; i++) {
      var d = new Date(start); d.setDate(d.getDate() + w * 7 + i);
      var key = mvYmd(d), rec = st.days[key], n = rec ? (rec.n | 0) : 0;
      if (i === 0) {
        if (d.getMonth() !== prevMon) { monLab = (d.getMonth() + 1) + '月'; prevMon = d.getMonth(); }
      }
      var cls = 'mv-d';
      if (key > tKey) cls += ' mv-future';
      else if (n >= MV_STEPS[3]) cls += ' mv-l4';
      else if (n >= MV_STEPS[2]) cls += ' mv-l3';
      else if (n >= MV_STEPS[1]) cls += ' mv-l2';
      else if (n >= MV_STEPS[0]) cls += ' mv-l1';
      if (key === tKey) cls += ' mv-today';
      cells.push('<i class="' + cls + '" title="' + key + ' ' + n + mvUnit() + '"></i>');
    }
    cols.push('<div class="mv-col"><span class="mv-mon">' + monLab + '</span>' + cells.join('') + '</div>');
  }
  return '<div class="mv-cal">'
    + '<div class="mv-wd"><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span>日</span></div>'
    + '<div class="mv-grid">' + cols.join('') + '</div></div>'
    + '<div class="mv-legend">すくない<i></i><i class="mv-l1"></i><i class="mv-l2"></i><i class="mv-l3"></i><i class="mv-l4"></i>おおい</div>';
}

}

/* ============ 問題数を選ぶ ============ */
let pendingKey = null;
function pick(key){
  const pool = POOLS[key].get();
  if(!pool.length){
    alert(key==='review' ? '今日の復習はありません。' :
          key==='fav'    ? 'お気に入りがまだありません。一覧か出題中に星を付けてください。' :

    `<button class="primary" onclick="begin(${pool.length})">ぜんぶ<br><small>${pool.length}問</small></button>`;

}
function closeSheet(){ document.getElementById('sheet').classList.add('hidden'); pendingKey = null; }

/* ============ 出題 ============ */
let queue = [], qi = 0, cornerKey = 'rand', log = [], timerId = null, revealed = false, leftover = [];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function begin(n){
  const key = pendingKey; closeSheet();
  cornerKey = key;
  const pool = shuffle(POOLS[key].get());
  queue = pool.slice(0, n); leftover = pool.slice(n);
  qi = 0; log = [];
  go('play'); show();
}
function resume(){
  if(!leftover.length) return;
  const n = Math.min(queue.length, leftover.length);
  queue = leftover.slice(0, n); leftover = leftover.slice(n);
  qi = 0; log = [];
  go('play'); show();
}

function show(){
  clearInterval(timerId); revealed = false;
  cur = queue[qi];
  document.getElementById('p-count').textContent = `${POOLS[cornerKey].name}　${qi+1} / ${queue.length}`;
  document.getElementById('p-solved').textContent = log.length ? `解いた ${log.length}問` : '';
  document.getElementById('p-pattern').textContent = cur.patternJa;
  document.getElementById('p-seen').innerHTML = isSeen(cur.id) ? '<span class="badge-seen">学習ずみ</span>' : '';
  renderStar();
  document.getElementById('p-before').classList.remove('hidden');
  document.getElementById('p-after').classList.add('hidden');

  const jaEl = document.getElementById('p-ja');
  if(opt.audio){
    jaEl.textContent = '（日本語を聞いて英語を言う）';
    jaEl.style.color = 'var(--sub)'; jaEl.style.fontSize = '17px';
    say(`audio_ja/${cur.id}.mp3`);
  }else{
    jaEl.textContent = cur.ja; jaEl.style.color=''; jaEl.style.fontSize='';
  }
  runTimer();
}
function renderStar(){
  const b = document.getElementById('p-star');
  b.textContent = isFav(cur.id) ? '★' : '☆';
  b.classList.toggle('on', isFav(cur.id));
}
function runTimer(){
  const box = document.getElementById('p-timer'), bar = box.querySelector('i');
  const lim = opt.limit;
  box.classList.remove('over');
  if(!lim){ bar.style.width='0%'; return; }
  const t0 = Date.now(), ms = lim*1000;
  bar.style.width = '100%';
  timerId = setInterval(() => {
    const left = 1 - (Date.now()-t0)/ms;
    if(left <= 0){
      bar.style.width='100%'; box.classList.add('over'); clearInterval(timerId);
      if(opt.nonstop && !revealed) reveal();
    } else bar.style.width = (left*100)+'%';
  }, 80);
}
function reveal(){
  clearInterval(timerId); revealed = true;
  const jaEl = document.getElementById('p-ja');
  jaEl.textContent = cur.ja; jaEl.style.color=''; jaEl.style.fontSize='';
  document.getElementById('p-before').classList.add('hidden');
  document.getElementById('p-after').classList.remove('hidden');
  document.getElementById('p-en').textContent = cur.en;
  document.getElementById('p-ptn').textContent = cur.pattern;
  document.getElementById('p-exp').textContent = cur.explanation;
  document.getElementById('p-apply').innerHTML = cur.apply.map((a,n)=>
    `<li><div class="aj">${a.ja}</div>
     <div class="ae">${a.en} <button class="spk" onclick="say('audio_apply/${cur.id}_${n+1}.mp3')">▶</button></div></li>`).join('');
  say(`audio/${cur.id}.mp3`);
}

/* 答え合わせ＝この瞬間に記録が確定する（途中でやめても残る） */
function grade(pct){
  const r = srs[cur.id] || { box:0 };
  r.box  = pct >= 60 ? Math.min(r.box + 1, BOX_DAYS.length - 1) : 0;
  r.next = addDays(BOX_DAYS[r.box]);
  r.last = today(); r.pct = pct;
  srs[cur.id] = r; saveJSON(SRS_KEY, srs); syncPush(SRS_KEY);

  if(!isSeen(cur.id)){ seen.push(cur.id); saveJSON(SEEN_KEY, seen); syncPush(SEEN_KEY); }
  mvGain(pct >= 80 ? true : (pct >= 40 ? 'half' : false));

  log.push({ id:cur.id, ja:cur.ja, en:cur.en, pct });
  qi++;
  if(qi >= queue.length) finish(); else show();
}

function quit(){
  clearInterval(timerId);
  if(aud) aud.pause();
  const rest = queue.length - log.length;
  const msg = log.length
    ? `ここまでの${log.length}問は学習ずみとして残ります。残り${rest}問をやめますか？`
    : 'まだ1問も答え合わせしていません。やめますか？';
  if(!confirm(msg)) return;
  leftover = queue.slice(qi).concat(leftover);
  log.length ? finish(true) : go('home');
}

function finish(partial){
  clearInterval(timerId);
  if(aud) aud.pause();
  const n = log.length, avg = n ? Math.round(log.reduce((s,x)=>s+x.pct,0)/n) : 0;
  document.getElementById('r-title').textContent = partial ? `ここまで${n}問、記録しました` : 'おつかれさま';
  document.getElementById('r-n').textContent = n;
  document.getElementById('r-avg').textContent = avg + '%';
  document.getElementById('r-weak').textContent = log.filter(x=>x.pct<60).length;
  document.getElementById('r-list').innerHTML = log.map(x =>
    `<div class="item"><div class="body"><div class="ij">${x.ja}
      <span class="pill" style="background:transparent;color:${x.pct>=60?'var(--ok)':'var(--ng)'}">${x.pct}%</span></div>
      <div class="ie">${x.en}</div></div></div>`).join('');
  const more = document.getElementById('r-more');
  more.classList.toggle('hidden', !leftover.length);
  more.textContent = `残り${leftover.length}問を続ける`;
  go('result');
}

refresh(); renderList(); mvRender(); initSync();
</script>
</body>
</html>
